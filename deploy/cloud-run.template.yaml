# Render image digest and canonical origin only after a recorded spending approval.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: flagexit
  labels:
    application: flagexit
    managed-by: hackathon-release
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      serviceAccountName: flagexit-runtime@tough-melody-508008-p8.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 30
      containers:
        - image: REPLACE_WITH_VERIFIED_IMMUTABLE_IMAGE_DIGEST
          ports:
            - containerPort: 8785
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: HOST
              value: 0.0.0.0
            - name: FLAGEXIT_PUBLIC_ORIGIN
              value: REPLACE_WITH_ACTUAL_SERVICE_ORIGIN
            - name: SOURCE_COMMIT
              value: REPLACE_WITH_ACTUAL_TESTED_COMMIT
