# No pipeline runs on push until sponsor-covered runner usage is verified.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
stages: [verify]
verify_retirement:
  image: node:24-bookworm-slim
  stage: verify
  timeout: 5m
  script:
    - npm ci
    - npm run build
    - mkdir -p artifacts
    - node --test --test-reporter=junit --test-reporter-destination=artifacts/tests.xml dist/tests/*.test.js
    - node scripts/generate-evidence.mjs
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/]
    reports:
      junit: artifacts/tests.xml
